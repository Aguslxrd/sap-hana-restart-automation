[defaults]
inventory = inventory/test.yml
roles_path = roles
host_key_checking = True
forks = 5
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
# Sin terminal (-tt): evita que el login del <sid>adm (tset) quede esperando
usetty = False
pipelining = True
# Mantiene viva la sesión durante esperas largas de sapcontrol
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
